
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple task management application built with JavaScript.">
  <title>TaskFlow | Task Manager</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="header">
      <div>
        <p class="eyebrow">PERSONAL PRODUCTIVITY</p>
        <h1>TaskFlow</h1>
        <p class="subtitle">Plan your day, one task at a time.</p>
      </div>
      <div class="date" id="today"></div>
    </header>

    <section class="stats" aria-label="Task statistics">
      <article class="stat">
        <span id="total-count">0</span>
        <p>Total tasks</p>
      </article>
      <article class="stat">
        <span id="pending-count">0</span>
        <p>Pending</p>
      </article>
      <article class="stat">
        <span id="completed-count">0</span>
        <p>Completed</p>
      </article>
    </section>

    <section class="panel">
      <h2>Add a task</h2>
      <form id="task-form">
        <label for="task-input">Task description</label>
        <div class="input-row">
          <input
            id="task-input"
            type="text"
            maxlength="120"
            placeholder="What do you need to do?"
            required
          >
          <button type="submit">Add task</button>
        </div>
        <p class="hint">Keep it clear and actionable (up to 120 characters).</p>
      </form>
    </section>

    <section class="tasks-section">
      <div class="section-heading">
        <h2>Your tasks</h2>
        <label class="filter-label" for="task-filter">
          Show:
          <select id="task-filter">
            <option value="all">All tasks</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </label>
      </div>

      <ul id="task-list" class="task-list" aria-live="polite"></ul>
      <p id="empty-state" class="empty-state">
        No tasks here yet. Add your first task above.
      </p>
    </section>

    <footer>
      TaskFlow · Built with HTML, CSS and JavaScript
    </footer>
  </main>
</body>
</html>
